apiVersion: apps/v1
kind: Deployment

metadata:
  name: python-app-deployment

spec:
  # HPA will control the number of replicas
  replicas: 3

  selector:
    matchLabels:
      app: python-app

  template:
    metadata:
      labels:
        app: python-app

    spec:
      containers:
        - name: python-app-container

          image: 094728020057.dkr.ecr.us-east-1.amazonaws.com/pythona-app:latest

          ports:
            - containerPort: 5000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
